<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunsjmeny uke {{ week }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Lunsjmeny uke {{ week }}</h1>
    {% for entry in days %}
    <section class="day{% if entry.is_today %} today{% endif %}"{% if entry.is_today %} aria-current="date"{% endif %}>
      <h2>{{ entry.day | capitalize }}{% if entry.is_today %} <span class="today-label">I dag</span>{% endif %}</h2>
      <ul>
        {% for dish in entry.dishes %}
        <li><span class="name">{{ dish.name }}</span> <span class="price">{{ dish.price }} kr</span></li>
        {% endfor %}
      </ul>
    </section>
    {% endfor %}
  </main>
</body>
</html>
